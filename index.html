<!doctype html>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const savedTheme = localStorage.getItem("n-cafe-theme");
        document.documentElement.dataset.theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
    </script>
    <meta name="description" content="Visit N Café in Loni Budruk, Shirdi for delicious burgers, sandwiches, pasta, fries, Chinese, combos and more. Explore the menu and order via WhatsApp." />
